<style>

  /* Tarjetas */

  .not-t-atencion { --nt:#f59e0b; --nt-text:#fbbf24; }
  .not-t-cambio   { --nt:#6366f1; --nt-text:#aab4ff; }
  .not-t-info     { --nt:#14b8a6; --nt-text:#5eead4; }
  [data-kmode="light"] .not-t-urgente  { --nt:#dc2626; --nt-text:#b91c1c; }

  .not-tipo { font-size:11px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:var(--nt-text); }
  .not-cuando { font-size:11.5px; color:var(--text-500); margin-top:2px; }
  .not-pills { margin-left:auto; display:flex; flex-wrap:wrap; gap:6px; justify-content:flex-end; }
  .not-pill { font-size:10.5px; font-weight:800; padding:3px 9px; border-radius:var(--radius-chip); text-transform:uppercase; letter-spacing:.04em; white-space:nowrap; }

  .not-tags { display:flex; flex-wrap:wrap; gap:6px; margin-top:12px; }

  .not-barra i { display:block; height:100%; border-radius:999px; background:linear-gradient(90deg, color-mix(in srgb, var(--nt) 70%, transparent), var(--nt)); }
  .not-pie { margin-top:14px; padding-top:12px; border-top:1px solid color-mix(in srgb, var(--nt) 22%, var(--ink-800)); }

  .not-ok { display:flex; align-items:center; gap:8px; font-size:13px; font-weight:700; color:var(--ok); }

  .not-renovar { margin-top:10px; }
  .not-vacio { text-align:center; padding:34px 18px; border:1px dashed var(--ink-700); border-radius:20px; color:var(--text-500); font-size:14px; line-height:1.6; }

  /* Aviso a pantalla completa (lectura obligatoria) y visor de foto: cuelgan del <body>, fuera de la pestaña */

<div class="not-top">
  <div>
    <h1 style="font-size:19px;font-weight:800;margin:0 0 4px;">🔔 Notificaciones</h1>
    <p style="color:var(--text-500);font-size:13px;margin:0;" id="notSubtitulo">Avisos del responsable para los jefes de equipo.</p>
  </div>
  <div class="not-acciones">

<script>
  const NOT_TIPOS = {
    urgente:  { n: 'Urgente', i: '🚨' },
    atencion: { n: 'A tener en cuenta', i: '⚠️' },
    cambio:   { n: 'Cambio operativo', i: '🔄' },
    info:     { n: 'Información', i: '💡' }
  };
  const NOT_ORDEN_TIPOS = ['cambio', 'info', 'atencion', 'urgente'];
  const NOT_PRESETS = [
    { v: 12, u: 'horas', t: '12 horas' }, { v: 1, u: 'dias', t: '1 día' }, { v: 3, u: 'dias', t: '3 días' },
    { v: 1, u: 'semanas', t: '1 semana' }, { v: 2, u: 'semanas', t: '2 semanas' }
  ];
  const NOT_UNIDADES = { horas: 'horas', dias: 'días', semanas: 'semanas' };
  const NOT_MS = { horas: 3600000, dias: 86400000, semanas: 604800000 };
  const NOT_TURNO_ICONO = { M: '☀️', T: '🌆', P: '🌓' };
  const NOT_REFRESCO_MS = 120000;
  const NOT_FOTO_MAX = 340000;      // caracteres de la data URI (el servidor admite 350.000)

  let notDatos = null;          // última respuesta de obtenerNotas
  let notT0 = 0;                // Date.now() del dispositivo cuando llegó (para calcular "ahora" sin depender del reloj del móvil)
  let notCargando = false;
  let notPeticion = 0;
  let notTimer = null;
  let notFirma = '';
  let notFTipo = 'info';
  let notFDur = { valor: 3, unidad: 'dias' };
  let notFSin = false;
  let notFFijada = false;
  let notFObl = false;
  let notFOblManual = false;        // si el supervisor tocó «Lectura obligatoria», «Urgente» ya no la cambia sola
  let notFCorreo = false;
  let notFDest = [];                // [] = todos los jefes; si no, los nombres elegidos
  let notFFoto = '';                // data URI de la foto elegida
  let notTurnosHoy = null;          // { leido, turnos:[{codigo,nombre,jefes}] } del cuadrante de hoy
  let notConfirmarRetirar = null;   // id de la nota en espera de confirmar "Retirar"
  let notConfirmarCorreo = null;    // id de la nota en espera de confirmar "enviar correo"
  let notRenovarAbierto = null;     // id de la nota con el selector de "Alargar" abierto
  let notVerHistorial = false;
  let notOmitidas = {};             // ids de notas obligatorias con «Ahora no» en esta sesión
  let notOvActual = null;           // id de la nota que enseña el aviso a pantalla completa
  let notFotoCache = {};            // id -> data URI ya descargada
  let notFotoFallo = {};            // id -> mensaje si no se pudo descargar
  let notFotoCargando = false;

  function notEsc(t) {
    return String(t == null ? '' : t).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function notErrorServidor(err) { return '❌ Error del servidor: ' + (err && err.message ? err.message : err); }
  function notModo() {
    if (CentinelaState.supervisor) return 'supervisor';
    return CentinelaState.jefe ? 'jefe' : 'sin';
  }
  function notPanelActivo() {
    const p = document.getElementById('tab-notas');
    return !!(p && p.classList.contains('activo'));
  }
  function notAhora() { return notDatos ? notDatos.ahoraMs + (Date.now() - notT0) : Date.now(); }
  function notP2(n) { return (n < 10 ? '0' : '') + n; }

  // "hoy 09:15", "ayer 16:40" o "dd/MM 10:00" (hora del dispositivo).
  function notCuando(ms) {
    if (ms === null || ms === undefined) return '';
    const d = new Date(ms), hoy = new Date();
    const h = notP2(d.getHours()) + ':' + notP2(d.getMinutes());
    const dia = function (x) { return x.getFullYear() * 10000 + (x.getMonth() + 1) * 100 + x.getDate(); };
    const ayer = new Date(); ayer.setDate(ayer.getDate() - 1);
    if (dia(d) === dia(hoy)) return 'hoy ' + h;
    if (dia(d) === dia(ayer)) return 'ayer ' + h;
    return notP2(d.getDate()) + '/' + notP2(d.getMonth() + 1) + ' ' + h;
  }
  // "menos de 1 h", "5 h", "2 d 4 h", "1 sem 2 d"
  function notRestante(ms) {
    if (ms <= 0) return 'caducada';
    const h = Math.floor(ms / 3600000);
    if (ms < 3600000) return 'menos de 1 h';
    if (h < 24) return h + ' h';
    const d = Math.floor(h / 24), rh = h % 24;
    if (d < 7) return d + ' d' + (rh ? ' ' + rh + ' h' : '');
    const s = Math.floor(d / 7), rd = d % 7;
    return s + ' sem' + (rd ? ' ' + rd + ' d' : '');
  }
  // "jue 02/10 a las 14:30"
  function notHasta(ms) {
    const d = new Date(ms);
    const dias = ['dom', 'lun', 'mar', 'mié', 'jue', 'vie', 'sáb'];
    return dias[d.getDay()] + ' ' + notP2(d.getDate()) + '/' + notP2(d.getMonth() + 1) + ' a las ' + notP2(d.getHours()) + ':' + notP2(d.getMinutes());
  }
  // "yyyy-MM-dd HH:mm" (hora del servidor) -> ms, o null
  function notParseFecha(txt) {
    const m = /^(\d{4})-(\d{2})-(\d{2}) (\d{2}):(\d{2})/.exec(String(txt || ''));
    return m ? new Date(+m[1], +m[2] - 1, +m[3], +m[4], +m[5]).getTime() : null;
  }
  function notEnterado(n, jefe) {
    return (n.enterados || []).some(function (e) { return e.jefe === jefe; });
  }
  function notSinLeer() {
    if (!notDatos || notModo() !== 'jefe') return 0;
    return (notDatos.notas || []).filter(function (n) { return !notEnterado(n, CentinelaState.jefe); }).length;
  }
  function notActualizarBadge() {
    const b = document.getElementById('tabBadgeNotas');
    if (!b) return;
    const n = notSinLeer();
    if (n > 0) { b.textContent = n > 9 ? '9+' : String(n); b.style.display = 'block'; }
    else { b.style.display = 'none'; }
  }
  function notTextoDestinatarios(dest) {
    if (!dest || !dest.length) return 'Todos los jefes';
    return dest.join(', ');
  }

  // ── Ganchos del cascarón ─────────────────────────────────
  function notasAlMostrar() { notCargar(false); notProgramarRefresco(); }
  function notasRecibirJefe() { notLimpiar(); notCargar(true); notProgramarRefresco(); }
  function notasAlCambiarIdentidad() { notLimpiar(); }
  function notasAlCambiarModo() { notLimpiar(); notCargar(true); notProgramarRefresco(); }

  // Un único temporizador: se para y se vuelve a armar en la MISMA función; notTick no lo toca.
  function notDetenerRefresco() {
    if (notTimer !== null) { clearInterval(notTimer); notTimer = null; }
  }
  function notProgramarRefresco() {
    notDetenerRefresco();
    if (notModo() === 'sin') return;
    notTimer = setInterval(notTick, NOT_REFRESCO_MS);
  }
  // Se refresca también con la pestaña en segundo plano: la insignia y el aviso obligatorio dependen de ello.
  function notTick() {
    if (notModo() === 'sin' || document.hidden || notCargando) return;
    const a = document.activeElement;
    if (a && a.closest && a.closest('#notForm')) return;     // no pisar lo que se está escribiendo
    notCargar(true);
  }

  function notLimpiar() {
    notDetenerRefresco();
    notPeticion++;
    notCargando = false;
    notDatos = null;
    notFirma = '';
    notConfirmarRetirar = null;
    notConfirmarCorreo = null;
    notRenovarAbierto = null;
    notVerHistorial = false;
    notOmitidas = {};
    notFotoCache = {};
    notFotoFallo = {};
    notFotoCargando = false;
    notCerrarOverlay();
    notCerrarVisor();
    document.getElementById('notForm').classList.remove('abierto');
    document.getElementById('notLista').innerHTML = '<p class="not-aviso-error">Cargando…</p>';
    document.getElementById('notResumen').innerHTML = '';
    document.getElementById('notHistorialBox').style.display = 'none';
    document.getElementById('notHistLista').innerHTML = '';
    notActualizarBadge();
    notAplicarModo();
  }

  function notAplicarModo() {
    const modo = notModo();
    document.getElementById('notSupBanner').classList.toggle('visible', modo === 'supervisor');
    document.getElementById('notBtnNueva').style.display = modo === 'supervisor' ? '' : 'none';
    if (modo !== 'supervisor') document.getElementById('notForm').classList.remove('abierto');
    document.getElementById('notSubtitulo').textContent = modo === 'supervisor'
      ? 'Publica avisos para los jefes de equipo y comprueba quién los ha leído.'
      : 'Cambios operativos, información de valor y cosas a tener en cuenta.';
  }

  // ── Carga ────────────────────────────────────────────────
  function notCargar(silencioso) {
    notAplicarModo();
    const modo = notModo();
    if (modo === 'sin') {
      document.getElementById('notLista').innerHTML = '<p class="not-aviso-error">Identifícate para ver las notas.</p>';
      return;
    }
    if (notCargando) return;
    notCargando = true;
    const peticion = ++notPeticion;
    const cont = document.getElementById('notLista');
    const fallo = function (texto) {
      notFirma = '';
      cont.innerHTML = '<p class="not-aviso-error">' + notEsc(texto) + ' <button type="button" onclick="notCargar(false)">Reintentar</button></p>';
    };
    google.script.run
      .withSuccessHandler(function (r) {
        if (peticion !== notPeticion) return;     // cambió la identidad o el modo mientras tanto
        notCargando = false;
        if (!r || !r.ok) { if (!silencioso || !notDatos) fallo('No se pudieron leer las notas (' + ((r && r.error) || 'error') + ').'); return; }
        const firma = JSON.stringify(r.notas) + JSON.stringify(r.historial || []) + Math.floor(r.ahoraMs / 300000);
        const cambio = firma !== notFirma;
        notFirma = firma;
        notDatos = r;
        notT0 = Date.now();
        notActualizarBadge();
        if (cambio) notPintar();
        notRevisarOverlay();
      })
      .withFailureHandler(function (err) {
        if (peticion !== notPeticion) return;
        notCargando = false;
        if (!silencioso || !notDatos) fallo(notErrorServidor(err));
      })
      .obtenerNotas({ historial: modo === 'supervisor', jefe: modo === 'jefe' ? CentinelaState.jefe : '' });
  }

  // ── Fotos de las notas (se piden aparte y se guardan en memoria) ─────────────
  // Una foto solo se pinta si es una data URI de imagen bien formada (la misma regla que aplica el servidor al guardarla):
  // así un dato raro escrito a mano en la hoja Notas_Fotos no puede colarse en el atributo src.
  function notUriFoto(uri) {
    return typeof uri === 'string' && uri.length <= 350000 && /^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+\/]+={0,2}$/.test(uri) ? uri : '';
  }
  function notHtmlFoto(id) {
    if (notFotoCache[id]) return '<img src="' + notFotoCache[id] + '" alt="Foto de la nota" onclick="notVerFoto(' + id + ')">';
    if (notFotoFallo[id]) return '<div class="estado">📷 No se pudo cargar la foto. <button type="button" onclick="notReintentarFoto(' + id + ')">Reintentar</button></div>';
    return '<div class="estado">📷 Cargando foto…</div>';
  }
  function notPintarFoto(id) {
    const els = document.querySelectorAll('[data-foto-id="' + id + '"]');
    for (let i = 0; i < els.length; i++) els[i].innerHTML = notHtmlFoto(id);
  }
  // Una foto cada vez (son de hasta ~260 KB): la siguiente empieza cuando termina la anterior.
  function notCargarFotos() {
    if (notFotoCargando || !notDatos) return;
    const todas = (notDatos.notas || []).concat(notDatos.historial || []);
    const pendiente = todas.filter(function (n) { return n.tieneFoto && !notFotoCache[n.id] && !notFotoFallo[n.id] && document.querySelector('[data-foto-id="' + n.id + '"]'); })[0];
    if (!pendiente) return;
    notFotoCargando = true;
    const id = pendiente.id, peticion = notPeticion;
    const fin = function () { notFotoCargando = false; if (peticion === notPeticion) notCargarFotos(); };
    google.script.run
      .withSuccessHandler(function (r) {
        if (peticion !== notPeticion) { notFotoCargando = false; return; }
        if (r && r.ok && notUriFoto(r.foto)) notFotoCache[id] = r.foto; else notFotoFallo[id] = (r && r.error) || 'foto no válida';
        notPintarFoto(id);
        fin();
      })
      .withFailureHandler(function (err) {
        if (peticion !== notPeticion) { notFotoCargando = false; return; }
        notFotoFallo[id] = (err && err.message) || 'error';
        notPintarFoto(id);
        fin();
      })
      .obtenerFotoNota({ id: id, jefe: notModo() === 'jefe' ? CentinelaState.jefe : '' });
  }
  function notReintentarFoto(id) {
    delete notFotoFallo[id];
    notPintarFoto(id);
    notCargarFotos();
  }

  // Visor a pantalla completa (toque para cerrar). Cuelga del <body> para verse sobre cualquier pestaña.
  function notAsegurarVisor() {
    let v = document.getElementById('notVisor');
    if (v) return v;
    v = document.createElement('div');
    v.id = 'notVisor';
    v.className = 'not-visor';
    v.hidden = true;
    v.setAttribute('role', 'dialog');
    v.setAttribute('aria-label', 'Foto ampliada');
    v.innerHTML = '<button type="button" aria-label="Cerrar la foto">✕</button><img alt="Foto ampliada">';
    v.onclick = function () { notCerrarVisor(); };
    document.body.appendChild(v);
    return v;
  }
  function notVerFoto(id) {
    if (!notFotoCache[id]) return;
    const v = notAsegurarVisor();
    v.querySelector('img').src = notFotoCache[id];
    v.hidden = false;
  }
  function notCerrarVisor() {
    const v = document.getElementById('notVisor');
    if (v) { v.hidden = true; v.querySelector('img').removeAttribute('src'); }
  }

  // ── Tarjetas ─────────────────────────────────────────────
  // opciones.preview: vista previa del formulario. opciones.overlay: dentro del aviso a pantalla completa (sin pie).
  function notTarjeta(n, opciones) {
    opciones = opciones || {};
    const t = NOT_TIPOS[n.tipo] || NOT_TIPOS.info;
    const modo = notModo();
    const jefe = CentinelaState.jefe;
    const sinLeer = opciones.preview ? true : (modo === 'jefe' && !notEnterado(n, jefe));
    const ahora = notAhora();
    const dest = n.destinatarios || [];

    let vis = '';
    if (n.sinCaducidad) {
      vis = '<div class="not-vis"><div class="not-vis-txt"><span>♾️ Sin fecha de caducidad</span></div></div>';
    } else if (n.caducaMs !== null && n.caducaMs !== undefined) {
      const total = Math.max(1, n.caducaMs - (n.publicadaMs || ahora));
      const quedan = n.caducaMs - ahora;
      const frac = Math.max(0, Math.min(1, quedan / total));
      vis = '<div class="not-vis"><div class="not-vis-txt"><span>⏳ Se ve hasta el <b>' + notEsc(notHasta(n.caducaMs)) + '</b></span><span>quedan <b>' + notEsc(notRestante(quedan)) + '</b></span></div>' +
        '<div class="not-barra" role="img" aria-label="Tiempo restante"><i style="width:' + (frac * 100).toFixed(1) + '%"></i></div></div>';
    }

    // Foto: en la vista previa es la local; en el resto se pide al servidor.
    let foto = '';
    if (opciones.preview && notUriFoto(n.fotoUri)) foto = '<div class="not-foto"><img src="' + n.fotoUri + '" alt="Foto adjunta"></div>';
    else if (!opciones.preview && n.tieneFoto) foto = '<div class="not-foto" data-foto-id="' + n.id + '">' + notHtmlFoto(n.id) + '</div>';

    // Etiquetas: a quién va, si es obligatoria y (solo supervisor) el estado del correo.
    let tags = '';
    if (modo === 'supervisor' || opciones.preview) {
      tags += '<span class="not-tag">👥 Para: ' + notEsc(notTextoDestinatarios(dest)) + '</span>';
      if (n.obligatoria) tags += '<span class="not-tag aviso">🔔 Lectura obligatoria</span>';
      if (opciones.preview && n.avisarCorreo) tags += '<span class="not-tag">✉️ Se avisará por correo</span>';
      if (!opciones.preview && n.correo === 'Enviado') tags += '<span class="not-tag ok">✉️ Correo enviado</span>';
      if (!opciones.preview && n.correo === 'NO enviado') tags += '<span class="not-tag aviso">⚠️ Correo NO enviado</span>';
    } else if (dest.length) {
      tags += '<span class="not-tag">🎯 Dirigida a ti</span>';
    }
    tags = tags ? '<div class="not-tags">' + tags + '</div>' : '';

    let pie = '';
    if (!opciones.preview && !opciones.overlay) {
      if (modo === 'jefe') {
        const mio = (n.enterados || []).filter(function (x) { return x.jefe === jefe; })[0];
        pie = mio
          ? '<div class="not-pie"><div class="not-ok">✅ Enterado' + (mio.fecha ? ' · ' + notEsc(notCuando(notParseFecha(mio.fecha))) : '') + '</div></div>'
          : '<div class="not-pie"><button type="button" class="not-btn-enterado" id="notBtnEnt-' + n.id + '" onclick="notMarcarEnterado(' + n.id + ')">✓ Enterado</button></div>';
      } else if (modo === 'supervisor') {
        const jefes = dest.length ? dest : ((notDatos && notDatos.jefes) || []);
        const chips = jefes.map(function (j) {
          const e = (n.enterados || []).filter(function (x) { return x.jefe === j; })[0];
          return '<span class="not-jefe' + (e ? ' ok' : '') + '">' + (e ? '✓ ' : '○ ') + notEsc(j) + (e && e.fecha ? ' · ' + notEsc(e.fecha.slice(11)) : '') + '</span>';
        }).join('');
        const confirmar = notConfirmarRetirar === n.id;
        const confCorreo = notConfirmarCorreo === n.id;
        const etiquetaCorreo = n.correo === 'Enviado' ? '✉️ Reenviar correo' : (n.correo === 'NO enviado' ? '✉️ Reintentar correo' : '✉️ Avisar por correo');
        pie = '<div class="not-pie"><div class="not-jefes">' + chips + '</div><div class="not-sup-acc">' +
          '<button type="button" class="not-acc" onclick="notFijar(' + n.id + ', ' + !n.fijada + ')">' + (n.fijada ? '📌 Desfijar' : '📌 Fijar arriba') + '</button>' +
          '<button type="button" class="not-acc" onclick="notToggleRenovar(' + n.id + ')">⏱ Alargar</button>' +
          '<button type="button" class="not-acc' + (confCorreo ? ' confirmar' : '') + '" id="notBtnCorreo-' + n.id + '" onclick="notEnviarCorreo(' + n.id + ')">' + (confCorreo ? '¿Enviar a ' + (dest.length || jefes.length) + '? Pulsa otra vez' : etiquetaCorreo) + '</button>' +
          '<button type="button" class="not-acc peligro' + (confirmar ? ' confirmar' : '') + '" id="notBtnRet-' + n.id + '" onclick="notRetirar(' + n.id + ')">' + (confirmar ? '¿Seguro? Pulsa otra vez' : '🗑 Retirar') + '</button></div>' +
          (notRenovarAbierto === n.id ? notHtmlRenovar(n.id) : '') + '</div>';
      }
    }

    return '<article class="not-card not-t-' + notEsc(n.tipo in NOT_TIPOS ? n.tipo : 'info') + (n.fijada ? ' fijada' : '') + (n.tipo === 'urgente' ? ' grande' : '') + '">' +
      '<div class="not-head"><span class="not-icono" aria-hidden="true">' + t.i + '</span>' +
      '<div><div class="not-tipo">' + notEsc(t.n) + '</div><div class="not-cuando">' + (opciones.preview ? 'ahora mismo' : notEsc(notCuando(n.publicadaMs))) + (n.autor && !opciones.preview ? ' · ' + notEsc(n.autor) : '') + '</div></div>' +
      '<div class="not-pills">' + (n.fijada ? '<span class="not-pill fijada">📌 Fijada</span>' : '') + (sinLeer ? '<span class="not-pill nueva">Nueva</span>' : '') + '</div></div>' +
      '<h3 class="not-titulo">' + notEsc(n.titulo) + '</h3>' +
      '<p class="not-texto">' + notEsc(n.texto) + '</p>' + foto + tags + vis + pie + '</article>';
  }

  function notHtmlRenovar(id) {
    return '<div class="not-renovar"><div class="not-presets">' + NOT_PRESETS.map(function (p, i) {
      return '<button type="button" class="not-preset" onclick="notRenovar(' + id + ', ' + i + ')">Desde ahora: ' + p.t + '</button>';
    }).join('') + '<button type="button" class="not-preset" onclick="notRenovar(' + id + ', -1)">♾️ Sin caducidad</button></div></div>';
  }

  function notPintar() {
    const d = notDatos || { notas: [], historial: [] };
    const modo = notModo();
    const lista = document.getElementById('notLista');
    const sin = notSinLeer();
    let resumen = '<span class="not-chip"><b>' + d.notas.length + '</b> ' + (d.notas.length === 1 ? 'nota activa' : 'notas activas') + '</span>';
    if (modo === 'jefe') resumen += sin > 0 ? '<span class="not-chip sin-leer"><b>' + sin + '</b> sin leer</span>' : (d.notas.length ? '<span class="not-chip">✅ Estás al día</span>' : '');
    document.getElementById('notResumen').innerHTML = resumen;

    if (!d.notas.length) {
      lista.innerHTML = '<div class="not-vacio"><span class="gran">📭</span>' +
        (modo === 'supervisor' ? '<b>No hay ninguna nota activa.</b><br>Publica la primera con <b>➕ Nueva nota</b>.' : '<b>No hay notas activas.</b><br>Cuando el responsable publique un aviso lo verás aquí.') + '</div>';
    } else {
      lista.innerHTML = d.notas.map(function (n) { return notTarjeta(n, {}); }).join('');
    }

    const hb = document.getElementById('notHistorialBox');
    const hist = d.historial || [];
    hb.style.display = modo === 'supervisor' ? '' : 'none';
    document.getElementById('notHistBtn').textContent = (notVerHistorial ? '▾ ' : '▸ ') + 'Caducadas y retiradas (' + hist.length + ')';
    document.getElementById('notHistLista').innerHTML = notVerHistorial ? (hist.length ? hist.map(function (n) {
      const t = NOT_TIPOS[n.tipo] || NOT_TIPOS.info;
      return '<div class="not-hist-card not-t-' + notEsc(n.tipo in NOT_TIPOS ? n.tipo : 'info') + '"><div class="not-hist-cab"><div><div class="not-hist-tit">' + t.i + ' ' + notEsc(n.titulo) + '</div>' +
        '<div class="not-hist-meta">' + notEsc(n.estado) + ' · publicada ' + notEsc(notCuando(n.publicadaMs)) + ' · ' + (n.enterados || []).length + ' enterado(s) · para ' + notEsc(notTextoDestinatarios(n.destinatarios)) + '</div></div>' +
        '<button type="button" class="not-acc" onclick="notToggleRenovar(' + n.id + ')">↺ Volver a publicar</button></div>' + (notRenovarAbierto === n.id ? notHtmlRenovar(n.id) : '') + '</div>';
    }).join('') : '<p class="not-aviso-error">Todavía no hay ninguna.</p>') : '';
    notCargarFotos();
  }

  function notToggleHistorial() { notVerHistorial = !notVerHistorial; notPintar(); }

  // ── Aviso a pantalla completa (lectura obligatoria) ──────
  // Cuelga del <body> (la pestaña puede estar oculta). Sale al abrir la app, o en cuanto llega una nota obligatoria
  // para el jefe, y se queda hasta que pulsa «Enterado». «Ahora no» lo aparta solo hasta la próxima vez que se abra la app.
  function notAsegurarOverlay() {
    let o = document.getElementById('notOverlay');
    if (o) return o;
    o = document.createElement('div');
    o.id = 'notOverlay';
    o.className = 'not-overlay';
    o.hidden = true;
    o.setAttribute('role', 'dialog');
    o.setAttribute('aria-modal', 'true');
    o.setAttribute('aria-labelledby', 'notOvTitulo');
    o.innerHTML = '<div class="not-ov-caja"><div class="not-ov-cab"><span class="not-ov-campana" aria-hidden="true">🔔</span><div><div class="not-ov-tit" id="notOvTitulo">Aviso importante</div><div class="not-ov-cont" id="notOvCont"></div></div></div>' +
      '<div id="notOvNota"></div>' +
      '<button type="button" class="not-btn-enterado not-ov-ok" id="notOvBtn">✓ Enterado</button>' +
      '<button type="button" class="not-ov-luego" id="notOvLuego">Ahora no</button></div>';
    document.body.appendChild(o);
    document.getElementById('notOvBtn').onclick = function () { if (notOvActual !== null) notMarcarEnterado(notOvActual, true); };
    document.getElementById('notOvLuego').onclick = function () { if (notOvActual !== null) { notOmitidas[notOvActual] = true; notRevisarOverlay(); } };
    return o;
  }
  function notPendientesObligatorias() {
    if (!notDatos || notModo() !== 'jefe') return [];
    return (notDatos.notas || []).filter(function (n) { return n.obligatoria && !notEnterado(n, CentinelaState.jefe) && !notOmitidas[n.id]; });
  }
  function notCerrarOverlay() {
    const o = document.getElementById('notOverlay');
    if (o) o.hidden = true;
    notOvActual = null;
    document.body.style.overflow = '';
  }
  // Recalcula qué hay pendiente: abre el aviso, pasa al siguiente o lo cierra. Se llama tras cada carga y cada «Enterado».
  function notRevisarOverlay() {
    const pend = notPendientesObligatorias();
    if (!pend.length) { notCerrarOverlay(); return; }
    const o = notAsegurarOverlay();
    // Si el jefe tiene abierto un cuadro del cascarón (sugerencias, contraseña de supervisor), no se le tapa: se espera al siguiente sondeo.
    if (o.hidden && document.querySelector('.koverlay.abierto')) return;
    const n = pend[0];
    const cambia = notOvActual !== n.id || o.hidden;
    notOvActual = n.id;
    document.getElementById('notOvCont').textContent = pend.length === 1 ? 'Tienes 1 nota de lectura obligatoria' : 'Tienes ' + pend.length + ' notas de lectura obligatoria';
    if (cambia) {
      document.getElementById('notOvNota').innerHTML = notTarjeta(n, { overlay: true });
      const b = document.getElementById('notOvBtn');
      b.disabled = false; b.textContent = '✓ Enterado';
      o.hidden = false;
      o.scrollTop = 0;
      document.body.style.overflow = 'hidden';
      try { b.focus(); } catch (e) { /* sin foco en pantallas muy antiguas */ }
      notCargarFotos();
    }
  }

  // ── Acciones del jefe ────────────────────────────────────
  function notMarcarEnterado(id, desdeAviso) {
    const btn = document.getElementById(desdeAviso ? 'notOvBtn' : 'notBtnEnt-' + id);
    if (btn) { btn.disabled = true; btn.textContent = 'Guardando…'; }
    const restaurar = function () { if (btn) { btn.disabled = false; btn.textContent = '✓ Enterado'; } };
    google.script.run
      .withSuccessHandler(function (r) {
        if (r && r.success) {
          showToast('✅ Marcada como enterado');
          const n = (notDatos && notDatos.notas || []).filter(function (x) { return x.id === id; })[0];
          if (n && !notEnterado(n, CentinelaState.jefe)) {
            const d = new Date();
            n.enterados = (n.enterados || []).concat([{ jefe: CentinelaState.jefe, fecha: d.getFullYear() + '-' + notP2(d.getMonth() + 1) + '-' + notP2(d.getDate()) + ' ' + notP2(d.getHours()) + ':' + notP2(d.getMinutes()) }]);
          }
          notFirma = '';
          notActualizarBadge();
          notPintar();
          notRevisarOverlay();
        } else {
          restaurar();
          showToast('❌ ' + ((r && r.error) || 'Error desconocido'));
          if (r && /ya no está activa|no va dirigida/.test(r.error || '')) notCargar(true);
        }
      })
      .withFailureHandler(function (err) { restaurar(); showToast(notErrorServidor(err)); })
      .marcarNotaEnterada({ id: id, jefe: CentinelaState.jefe });
  }

  // ── Acciones del supervisor ──────────────────────────────
  function notRecargarTras(r, ok) {
    if (r && r.success) showToast(ok); else showToast('❌ ' + ((r && r.error) || 'Error desconocido'));
    notFirma = '';
    notCargando = false;
    notCargar(true);
  }
  function notFijar(id, fijada) {
    google.script.run
      .withSuccessHandler(function (r) { notRecargarTras(r, fijada ? '📌 Nota fijada arriba' : 'Nota desfijada'); })
      .withFailureHandler(function (err) { showToast(notErrorServidor(err)); })
      .fijarNota({ id: id, fijada: fijada });
  }
  // Dos pasos, como anular una tarea: el primer toque pide confirmar, el segundo retira.
  function notRetirar(id) {
    if (notConfirmarRetirar !== id) { notConfirmarRetirar = id; notConfirmarCorreo = null; notPintar(); return; }
    const btn = document.getElementById('notBtnRet-' + id);
    if (btn) { btn.disabled = true; btn.textContent = 'Retirando…'; }
    google.script.run
      .withSuccessHandler(function (r) { notConfirmarRetirar = null; notRecargarTras(r, '🗑 Nota retirada (queda en el historial)'); })
      .withFailureHandler(function (err) { notConfirmarRetirar = null; showToast(notErrorServidor(err)); notPintar(); })
      .retirarNota({ id: id });
  }
  // Enviar (o reenviar) el correo de una nota ya publicada. Dos toques: un correo a los jefes no se manda por accidente.
  function notEnviarCorreo(id) {
    if (notConfirmarCorreo !== id) { notConfirmarCorreo = id; notConfirmarRetirar = null; notPintar(); return; }
    const btn = document.getElementById('notBtnCorreo-' + id);
    if (btn) { btn.disabled = true; btn.textContent = 'Enviando…'; }
    google.script.run
      .withSuccessHandler(function (r) { notConfirmarCorreo = null; notRecargarTras(r, '✉️ Correo enviado'); })
      .withFailureHandler(function (err) { notConfirmarCorreo = null; showToast(notErrorServidor(err)); notPintar(); })
      .reenviarCorreoNota({ id: id });
  }
  function notToggleRenovar(id) {
    notRenovarAbierto = notRenovarAbierto === id ? null : id;
    notPintar();
  }
  function notRenovar(id, idxPreset) {
    const datos = { id: id };
    if (idxPreset < 0) datos.sin_caducidad = true;
    else datos.duracion = { valor: NOT_PRESETS[idxPreset].v, unidad: NOT_PRESETS[idxPreset].u };
    google.script.run
      .withSuccessHandler(function (r) { notRenovarAbierto = null; notRecargarTras(r, '⏱ Nota publicada de nuevo: ' + (r && r.duracion ? r.duracion : '')); })
      .withFailureHandler(function (err) { showToast(notErrorServidor(err)); })
      .renovarNota(datos);
  }

  // ── Formulario de nueva nota ─────────────────────────────
  function notToggleNueva() {
    const f = document.getElementById('notForm');
    const abrir = !f.classList.contains('abierto');
    f.classList.toggle('abierto', abrir);
    if (abrir) {
      notPintarForm();
      notCargarTurnos();
      document.getElementById('notFTitulo').focus();
    }
  }
  function notPintarForm() {
    document.getElementById('notFTipos').innerHTML = NOT_ORDEN_TIPOS.map(function (k) {
      return '<button type="button" class="not-tipo-op not-t-' + k + (notFTipo === k ? ' sel' : '') + '" aria-pressed="' + (notFTipo === k) + '" onclick="notElegirTipo(\'' + k + '\')"><span class="ic">' + NOT_TIPOS[k].i + '</span>' + NOT_TIPOS[k].n + '</button>';
    }).join('');
    notPintarDest();
    document.getElementById('notFPresets').innerHTML = NOT_PRESETS.map(function (p, i) {
      const sel = !notFSin && notFDur.valor === p.v && notFDur.unidad === p.u;
      return '<button type="button" class="not-preset' + (sel ? ' sel' : '') + '" onclick="notElegirPreset(' + i + ')">' + p.t + '</button>';
    }).join('') + '<button type="button" class="not-preset' + (notFSin ? ' sel' : '') + '" onclick="notToggleSin()">♾️ Sin caducidad</button>';
    document.getElementById('notFUnidades').innerHTML = Object.keys(NOT_UNIDADES).map(function (u) {
      return '<button type="button" class="not-unidad' + (notFDur.unidad === u ? ' sel' : '') + '" onclick="notElegirUnidad(\'' + u + '\')">' + NOT_UNIDADES[u] + '</button>';
    }).join('');
    document.getElementById('notFDur').classList.toggle('off', notFSin);
    document.getElementById('notFValor').disabled = notFSin;
    document.getElementById('notFValor').value = notFDur.valor;
    const opcion = function (id, sel, icono, titulo, sub) {
      const b = document.getElementById(id);
      b.className = 'not-opcion' + (sel ? ' sel' : '');
      b.setAttribute('aria-pressed', String(sel));
      b.innerHTML = '<span class="ic" aria-hidden="true">' + icono + '</span><span><b>' + titulo + '</b><small>' + sub + '</small></span>';
    };
    opcion('notFFijar', notFFijada, '📌', notFFijada ? 'Fijada arriba' : 'Fijar arriba', 'Sale la primera de la lista');
    opcion('notFObl', notFObl, '🔔', notFObl ? 'Lectura obligatoria: sí' : 'Lectura obligatoria', 'Aviso a pantalla completa al abrir la app, hasta que pulse «Enterado»');
    opcion('notFCorreo', notFCorreo, '✉️', notFCorreo ? 'Se avisará por correo' : 'Avisar por correo', 'Correo premium a los destinatarios (con los responsables en copia)');
    notPintarFotoForm();
    notActualizarPreview();
  }

  // Destinatarios: «Todos» (lista vacía) o los jefes marcados; y, si se pudo leer el cuadrante, atajos por turno de hoy.
  function notJefesLista() { return (notDatos && notDatos.jefes) || (typeof JEFES !== 'undefined' ? JEFES : []); }
  function notPintarDest() {
    const jefes = notJefesLista();
    const todos = notFDest.length === 0;
    document.getElementById('notFDest').innerHTML =
      '<button type="button" class="not-dest-op' + (todos ? ' sel' : '') + '" aria-pressed="' + todos + '" onclick="notElegirTodos()">👥 Todos los jefes</button>' +
      jefes.map(function (j, i) {
        const sel = notFDest.indexOf(j) > -1;
        return '<button type="button" class="not-dest-op' + (sel ? ' sel' : '') + '" aria-pressed="' + sel + '" onclick="notToggleDest(' + i + ')">👤 ' + notEsc(j) + '</button>';
      }).join('');
    const tn = notTurnosHoy && notTurnosHoy.leido ? notTurnosHoy.turnos : [];
    document.getElementById('notFTurnos').innerHTML = tn.length
      ? '<div class="not-turnos-tit">Según el cuadrante de hoy (se guarda la lista de nombres):</div>' + tn.map(function (g, i) {
        const sel = notFDest.length > 0 && notFDest.length === g.jefes.length && g.jefes.every(function (j) { return notFDest.indexOf(j) > -1; });
        return '<button type="button" class="not-turno-op' + (sel ? ' sel' : '') + '" aria-pressed="' + sel + '" onclick="notElegirTurno(' + i + ')">' + (NOT_TURNO_ICONO[g.codigo] || '🕒') + ' Turno de ' + notEsc(g.nombre.toLowerCase()) + '<small>' + notEsc(g.jefes.join(', ')) + '</small></button>';
      }).join('')
      : (notTurnosHoy && !notTurnosHoy.leido ? '<div class="not-turnos-tit">No se pudo leer el cuadrante de hoy: elige a mano.</div>' : '');
    document.getElementById('notFDestHint').textContent = notFDest.length
      ? 'Solo la verán' + (notFCorreo ? ' y la recibirán por correo' : '') + ': ' + notFDest.join(', ') + '. El resto de jefes no sabrá que existe.'
      : 'La verán todos los jefes de equipo.';
  }
  function notNormalizarDest(lista) {
    const jefes = notJefesLista();
    const ordenada = jefes.filter(function (j) { return lista.indexOf(j) > -1; });
    return ordenada.length === jefes.length ? [] : ordenada;       // los cuatro = todos
  }
  function notElegirTodos() { notFDest = []; notPintarForm(); }
  function notToggleDest(i) {
    const j = notJefesLista()[i];
    const actual = notFDest.slice();
    const k = actual.indexOf(j);
    if (k > -1) actual.splice(k, 1); else actual.push(j);
    notFDest = notNormalizarDest(actual);
    notPintarForm();
  }
  function notElegirTurno(i) {
    const g = notTurnosHoy && notTurnosHoy.turnos[i];
    if (!g) return;
    const igual = notFDest.length === g.jefes.length && g.jefes.every(function (j) { return notFDest.indexOf(j) > -1; });
    notFDest = igual ? [] : notNormalizarDest(g.jefes.slice());    // tocar otra vez el mismo turno vuelve a «todos»
    notPintarForm();
  }
  function notCargarTurnos() {
    google.script.run
      .withSuccessHandler(function (r) { notTurnosHoy = r && r.ok ? r : null; if (document.getElementById('notForm').classList.contains('abierto')) notPintarDest(); })
      .withFailureHandler(function () { notTurnosHoy = { ok: true, leido: false, turnos: [] }; notPintarDest(); })
      .obtenerTurnosHoyJefes();
  }

  function notElegirTipo(k) {
    notFTipo = k;
    if (!notFOblManual) notFObl = k === 'urgente';         // una nota urgente sale obligatoria salvo que se diga lo contrario
    notPintarForm();
  }
  function notElegirPreset(i) { notFSin = false; notFDur = { valor: NOT_PRESETS[i].v, unidad: NOT_PRESETS[i].u }; notPintarForm(); }
  function notToggleSin() { notFSin = !notFSin; notPintarForm(); }
  function notElegirUnidad(u) { notFSin = false; notFDur.unidad = u; notPintarForm(); }
  function notCambiarValor() {
    const v = parseInt(document.getElementById('notFValor').value, 10);
    notFDur.valor = isFinite(v) && v > 0 ? v : 0;
    // al escribir a mano se actualizan los destacados y el texto, sin repintar el campo (perdería el cursor)
    const presets = document.querySelectorAll('#notFPresets .not-preset');
    for (let i = 0; i < NOT_PRESETS.length; i++) presets[i].classList.toggle('sel', !notFSin && notFDur.valor === NOT_PRESETS[i].v && notFDur.unidad === NOT_PRESETS[i].u);
    notActualizarPreview();
  }
  function notToggleFijada() { notFFijada = !notFFijada; notPintarForm(); }
  function notToggleObl() { notFObl = !notFObl; notFOblManual = true; notPintarForm(); }
  function notToggleCorreo() { notFCorreo = !notFCorreo; notPintarForm(); }

  // ── Foto del formulario (se reduce aquí: lado mayor 1280 px, JPEG) ───────────
  function notComprimirFoto(file) {
    return new Promise(function (resolve, reject) {
      if (!file || !/^image\//.test(file.type || '')) { reject(new Error('El archivo no es una imagen.')); return; }
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = function () {
        URL.revokeObjectURL(url);
        const ancho = img.naturalWidth || img.width, alto = img.naturalHeight || img.height;
        if (!ancho || !alto) { reject(new Error('No se pudo leer la imagen.')); return; }
        let lado = 1280;
        for (let intento = 0; intento < 5; intento++) {
          const k = Math.min(1, lado / Math.max(ancho, alto));
          const c = document.createElement('canvas');
          c.width = Math.max(1, Math.round(ancho * k));
          c.height = Math.max(1, Math.round(alto * k));
          const ctx = c.getContext('2d');
          ctx.fillStyle = '#ffffff';                 // una PNG con transparencia no debe quedar negra
          ctx.fillRect(0, 0, c.width, c.height);
          ctx.drawImage(img, 0, 0, c.width, c.height);
          for (let q = 0.75; q >= 0.39; q -= 0.1) {
            const d = c.toDataURL('image/jpeg', q);
            if (d.length <= NOT_FOTO_MAX) { resolve(d); return; }
          }
          lado = Math.round(lado * 0.75);
        }
        reject(new Error('La foto es demasiado grande.'));
      };
      img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('No se pudo abrir la imagen.')); };
      img.src = url;
    });
  }
  function notAbrirSelectorFoto() {
    const inp = document.getElementById('notFotoInput');
    inp.value = '';
    inp.click();
  }
  function notAlElegirFoto(input) {
    const file = input.files && input.files[0];
    if (!file) return;
    showToast('⏳ Preparando foto…');
    notComprimirFoto(file).then(function (uri) { notFFoto = uri; notPintarFotoForm(); notActualizarPreview(); })
      .catch(function (err) { showToast('❌ ' + ((err && err.message) || 'No se pudo preparar la foto')); });
  }
  function notQuitarFoto() { notFFoto = ''; notPintarFotoForm(); notActualizarPreview(); }
  function notPintarFotoForm() {
    document.getElementById('notFFotoZona').innerHTML = notFFoto
      ? '<div class="not-foto-prev"><img src="' + notFFoto + '" alt="Foto elegida"><div class="info">Foto lista (' + Math.round(notFFoto.length * 0.75 / 1024) + ' KB)</div>' +
        '<button type="button" onclick="notAbrirSelectorFoto()">Cambiar</button><button type="button" onclick="notQuitarFoto()">Quitar</button></div>'
      : '<button type="button" class="not-foto-btn" onclick="notAbrirSelectorFoto()">📷 Adjuntar una foto</button>';
  }

  // Datos del formulario como nota (para la vista previa y para publicar).
  function notNotaDelForm() {
    const ahora = Date.now();
    const ms = notFSin || !notFDur.valor ? null : notFDur.valor * NOT_MS[notFDur.unidad];
    return {
      id: 0,
      titulo: document.getElementById('notFTitulo').value.trim() || 'Título de la nota',
      texto: document.getElementById('notFTexto').value.trim() || 'Aquí irá el texto de la nota.',
      tipo: notFTipo, fijada: notFFijada, publicadaMs: ahora, autor: '',
      sinCaducidad: notFSin, caducaMs: ms === null ? null : ahora + ms, enterados: [],
      destinatarios: notFDest.slice(), obligatoria: notFObl, avisarCorreo: notFCorreo, fotoUri: notFFoto
    };
  }
  function notActualizarPreview() {
    document.getElementById('notFTituloCont').textContent = document.getElementById('notFTitulo').value.length + ' / 80';
    document.getElementById('notFTextoCont').textContent = document.getElementById('notFTexto').value.length + ' / 1500';
    const n = notNotaDelForm();
    document.getElementById('notFHasta').textContent = notFSin ? 'La nota no caducará: tendrás que retirarla tú.'
      : (n.caducaMs ? 'Se verá hasta el ' + notHasta(n.caducaMs) + '.' : 'Escribe cuánto tiempo se verá.');
    document.getElementById('notFPreview').innerHTML = '<div class="not-lista">' + notTarjeta(n, { preview: true }) + '</div>';
  }

  function notPublicar() {
    const titulo = document.getElementById('notFTitulo').value.trim();
    const texto = document.getElementById('notFTexto').value.trim();
    if (!titulo) { showToast('❌ Escribe un título'); return; }
    if (!texto) { showToast('❌ Escribe el texto de la nota'); return; }
    if (!notFSin && !(notFDur.valor > 0)) { showToast('❌ Indica cuánto tiempo se verá la nota (o marca «Sin caducidad»)'); return; }
    const boton = document.getElementById('notFPublicar');
    boton.disabled = true;
    boton.textContent = 'Publicando…';
    const restaurar = function () { boton.disabled = false; boton.textContent = 'Publicar nota'; };
    const datos = { titulo: titulo, texto: texto, tipo: notFTipo, fijada: notFFijada, creador: 'Supervisor', destinatarios: notFDest.slice(), obligatoria: notFObl, avisar_correo: notFCorreo, foto: notFFoto };
    if (notFSin) datos.sin_caducidad = true; else datos.duracion = { valor: notFDur.valor, unidad: notFDur.unidad };
    google.script.run
      .withSuccessHandler(function (r) {
        restaurar();
        if (r && r.success) {
          let msg = r.pendiente ? r.mensaje : '✅ Nota publicada' + (r.duracion ? ' · ' + r.duracion : '');
          if (r.pendiente) { /* queda a la espera del jefe de área: el mensaje ya lo explica */ }
          else if (r.correo === 'enviado') msg += ' · correo enviado';
          else if (r.correo === 'fallo') msg += ' · ❌ el correo NO se pudo enviar (puedes reintentarlo desde la nota)';
          showToast(msg);
          document.getElementById('notFTitulo').value = '';
          document.getElementById('notFTexto').value = '';
          notFTipo = 'info'; notFDur = { valor: 3, unidad: 'dias' }; notFSin = false; notFFijada = false;
          notFObl = false; notFOblManual = false; notFCorreo = false; notFDest = []; notFFoto = '';
          document.getElementById('notForm').classList.remove('abierto');
          notFirma = '';
          notCargando = false;
          notCargar(true);
        } else {
          showToast('❌ ' + ((r && r.error) || 'Error desconocido'));
        }
      })
      .withFailureHandler(function (err) { restaurar(); showToast(notErrorServidor(err)); })
      .publicarNota(datos);
  }

  // Sin arranque propio: CentinelaState los define el cascarón DESPUÉS de este script; la pestaña
  // se carga desde los ganchos (notasRecibirJefe / notasAlMostrar / notasAlCambiarModo).
</script>
